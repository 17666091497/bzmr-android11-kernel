name: Build KernelSU for Redmi Note10 (bzmr)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_DIR: "."
  DEFCONFIG: "bzmr_defconfig"
  CLANG_VERSION: "r383902"
  KSU_BRANCH: "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev device-tree-compiler \
            ccache python3 git curl wget zip unzip

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu-a/10.3-2021.07/binrel/gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.tar.xz" -O clang.tar.xz
          tar -xf clang.tar.xz
          rm clang.tar.xz
          cd ../..

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/env.KSU[B]RANCH/kernel/setup.sh"|bash-s{{ env.KSU_BRANCH }}

      - name: Enable KernelSU in Defconfig
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_KSU_DEBUG=n" >> arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: Build Kernel
        run: |
          export PATH="(pwd)/toolchains/clang/bin:PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang
          make O=out ${{ env.DEFCONFIG }}
          make O=out -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-bzmr-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
